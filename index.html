<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch the vase</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Mali:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>

:root{--c:96px;--gap:32px;--fs:26px;--hs:1.35;--lblw:calc(50vw - var(--c)/2 - var(--gap) - 14px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;background:#0b0d10;font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:filter .5s}
body.rewinding #bg{filter:sepia(1) hue-rotate(160deg) saturate(2) contrast(1.1)}

/* main cuộn được nếu màn hình quá thấp, .wrap tự căn giữa */
main{position:relative;z-index:3;height:100%;display:flex;overflow-x:hidden;overflow-y:auto;padding:16px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%;margin:auto}

/* Paper card */
.card{position:relative;width:min(440px,100%);min-height:250px;padding:26px 24px 24px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
 background:#e9dfc4 url('paper.png') center/cover no-repeat;
 border-radius:4px;color:#2b2118;
 box-shadow:0 2px 4px rgba(0,0,0,.35),0 18px 50px rgba(0,0,0,.65),inset 0 0 60px rgba(90,60,20,.25);
 transform:rotate(-.6deg)}
.row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
#text{font-family:'Patrick Hand','Mali',cursive;font-weight:400;font-size:clamp(22px,3.6vw,32px);line-height:1.15;text-align:center;
 max-width:250px;transition:opacity .5s,transform .5s}
#text{white-space:pre-line}
#text.out{opacity:0;transform:translateY(6px)}
#text.md{font-size:clamp(18px,5vw,24px);max-width:270px}
#text.lg{font-size:clamp(16px,4.4vw,21px);max-width:290px}
#vase{height:clamp(90px,17vh,140px);max-width:100%;object-fit:contain;cursor:pointer;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));
 transition:transform .3s,opacity .4s;animation:float 4s ease-in-out infinite}
#vase:hover{transform:scale(1.06) rotate(-2deg)}
#vase.out{opacity:0}
@keyframes float{50%{transform:translateY(-5px)}}

/* Lựa chọn hội thoại */
#choices{min-height:calc(var(--c) + 24px);width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.choice,.multi{position:relative;width:var(--c);height:var(--c);animation:pop .5s both}
.choice{background:none;border:0;cursor:pointer;color:#fff}
.choice svg,.multi svg{width:var(--c);height:var(--c);overflow:visible}
.choice path,.multi path{fill:none;stroke:#fff;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7));stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
 stroke-dasharray:220;stroke-dashoffset:220;animation:draw .7s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lbl,.opt,.opt-r{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.85);font:400 var(--fs)/1.1 'Patrick Hand','Mali',cursive;letter-spacing:.3px;
 opacity:.85;max-width:var(--lblw);white-space:normal;background:none;border:0;cursor:pointer;
 transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.lbl,.opt-r{position:absolute;left:calc(var(--c) + var(--gap));top:50%;transform:translateY(-50%);transform-origin:left center;text-align:left;width:max-content}
.choice:hover .lbl,.opt-r:hover{opacity:1;transform:translateY(-50%) scale(var(--hs))}
.opts{position:absolute;right:calc(var(--c) + var(--gap));width:max-content;max-width:var(--lblw);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.opt{transform-origin:right center;text-align:right;max-width:100%}
.opt:hover{opacity:1;transform:scale(var(--hs))}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}

.rewind{width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(18,22,28,.82);
 cursor:pointer;display:grid;place-items:center;transition:all .25s;animation:pop .5s both,pulse 2.2s ease-in-out infinite}
.rewind:hover{border-color:#7fdcff;box-shadow:0 0 28px rgba(127,220,255,.7)}
.rewind svg{width:60px;height:60px;overflow:visible}
.rewind path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round}
.rewind.pic{padding:0;overflow:hidden;border-width:2px}
.rewind canvas{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
@keyframes pulse{50%{box-shadow:0 0 20px rgba(127,220,255,.45)}}
#rwgif{height:150px;max-width:100%;object-fit:contain}

/* Thanh chỉnh âm lượng */
#vol{position:fixed;left:16px;bottom:16px;z-index:6;display:flex;align-items:center;gap:10px}
#volbtn{background:none;border:0;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
#volbtn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#volrange{--p:100%;-webkit-appearance:none;appearance:none;width:120px;height:4px;border-radius:2px;outline:none;cursor:pointer;
 background:linear-gradient(to right,#fff var(--p),rgba(255,255,255,.35) var(--p));filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
#volrange::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:0}
#volrange::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
#volrange::-moz-range-track{background:transparent}

/* Gợi ý "Click vào cái bình hoa đi": vòng doodle quanh vase + đường nối + chữ, tất cả nằm trong container */
:root{--line:60px}
#text:empty{display:none}
#vasebox{position:relative;display:inline-block;flex:none}
#vasebox #vase{display:block}
.row.hinting{flex-wrap:nowrap;width:100%;gap:12px}
.hint{position:absolute;transition:opacity .3s}
.hint path,.hintline path{fill:none;stroke:#2b2118;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hintcircle{left:-14%;top:-14%;width:128%;height:128%;pointer-events:none;overflow:visible;animation:wipe .8s .2s ease-out both}
#hintside{display:flex;align-items:flex-start;gap:4px;align-self:flex-start;margin-top:2px;flex:0 1 auto;min-width:0;max-width:240px;transition:opacity .3s}
.hintline{flex:none;width:var(--line);height:40px;overflow:visible;pointer-events:none;animation:wipe .5s .9s ease-out both}
#hintlbl{min-width:0;margin-top:-2px;cursor:pointer;white-space:normal;
 font:400 26px/1.1 'Patrick Hand','Mali',cursive;color:#2b2118;opacity:0;animation:hintin .5s 1.5s forwards;
 transform-origin:left top;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#hintlbl:hover{transform:scale(1.1)}
@keyframes hintin{to{opacity:1}}
@keyframes wipe{from{clip-path:inset(-10% 100% -10% -10%)}to{clip-path:inset(-10% -10% -10% -10%)}}
#vasebox.touched .hint{opacity:0 !important;pointer-events:none;animation:none}
#vasebox.touched #vase{cursor:default}
#vasebox.touched #vase:hover{transform:none}

/* GIF trang trí ở góc phải trên của container (một phần nằm trong, một phần nằm ngoài) */
.deco{position:absolute;height:auto;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55))}
.deco.on{opacity:1}
.deco.tilt{transform:rotate(10deg)}
.deco.pear{width:184px;top:-74px;right:-74px}
.deco.nora{width:276px;top:-60px;right:-236px}
.deco.a4{width:min(375px,100%);top:100%;right:auto;left:50%;margin-top:-3px;transform:translateX(-50%) rotate(.6deg)}

/* ===== Responsive ===== */
/* Màn hình hẹp: không còn chỗ bên phải, nên gif nằm phía trên container, chỉ đè lên mép trên một chút */
@media (max-width:900px){
 .deco.nora{top:auto;bottom:calc(100% - 24px);right:-6px}
}
@media (max-width:600px){
 :root{--c:72px;--gap:18px;--fs:21px;--hs:1.2;--line:46px;--hintw:205px}
 #hintlbl{font-size:21px}
 .deco.pear{width:128px;top:-50px;right:-6px}
 .deco.nora{width:192px}
 main{padding:12px}
 .wrap{gap:18px}
 .card{min-height:210px;padding:20px 16px 18px;gap:12px}
 .row{gap:12px}
 #text{font-size:clamp(20px,6vw,26px);max-width:210px}
 #vase{height:clamp(80px,14vh,115px)}
 #vol{left:10px;bottom:10px}
 #volrange{width:90px}
 .rewind{width:76px;height:76px}
 .rewind svg{width:50px;height:50px}
 #rwgif{height:115px}
}
@media (max-height:560px){
 .card{min-height:0;padding:14px 18px}
 #vase{height:clamp(60px,22vh,90px)}
 .wrap{gap:10px}
 :root{--c:60px;--fs:20px}
 #choices{min-height:calc(var(--c) + 8px)}
 #rwgif{height:90px}
}
</style>
</head>
<body>
<video id="bg" src="background.mp4" autoplay muted loop playsinline></video>
<audio id="song" src="song.mp3" loop preload="auto"></audio>
<audio id="rwsound" src="rewind.mp3" preload="auto"></audio>
<div id="vol">
  <button id="volbtn" aria-label="Tắt/bật tiếng"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><g id="volwaves"></g></svg></button>
  <input id="volrange" type="range" min="0" max="1" step="0.01" value="1" aria-label="Âm lượng">
</div>

<main>
  <div class="wrap">
    <div class="card">
      <img id="deco" class="deco" alt="">
      <div class="row hinting" id="row">
        <div id="text"></div>
        <div id="vasebox">
          <img id="vase" src="vase.png" alt="vase">
          <svg class="hint hintcircle" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M52 6 C78 4 96 24 94 52 C92 80 72 96 46 94 C20 92 5 74 7 46 C9 20 28 8 52 6 Z"/></svg>
        </div>
        <div id="hintside">
          <svg class="hintline" viewBox="0 0 70 40" preserveAspectRatio="none"><path d="M0 34 Q36 28 70 10"/></svg>
          <span id="hintlbl">Click vào cái bình hoa đi.</span>
        </div>
      </div>
    </div>
    <div id="choices"></div>
  </div>
</main>

<script>
/* ====== CẤU HÌNH ====== */
const REWIND_MS = 5000;        // thời gian tua ngược (ms)
// Khi mở trực tiếp bằng file:// trình duyệt chặn đọc text1.txt / text2.txt,
// nên nội dung được ghi sẵn ở đây. (Nếu chạy qua server, trang sẽ ưu tiên đọc từ file .txt)
const TEXT1 = "Hello Max Caulfield wannabe, đừng vội mở hộp quà mà hãy đọc những dòng này trước nha. Năm ngoái anh đã miss quà sinh nhật của em vì anh không tự tin vào khả năng may vá của mình.";
const TEXT2 = "Vì vậy năm nay anh đã chơi lớn, anh dồn món quà của năm ngoái và năm nay thành 1 cái nên đừng hỏi vì sao effort lại cao như vậy (có bao giờ effort thấp).";
const REVERSE_SPEED   = 2;      // tốc độ tua ngược video (1 = bình thường)

const bg = document.getElementById('bg');
const text = document.getElementById('text');
const vase = document.getElementById('vase');
const choices = document.getElementById('choices');
const wait = ms => new Promise(r => setTimeout(r, ms));
let busy = false;

async function setText(t){
  text.classList.add('out'); await wait(450);
  text.textContent = t;
  text.classList.toggle('md', t.length > 90 && t.length <= 170);
  text.classList.toggle('lg', t.length > 170);
  text.classList.remove('out');
}
async function swapVase(src){
  vase.classList.add('out'); await wait(300);
  vase.src = src; vase.classList.remove('out');
}
const DOODLE = '<svg viewBox="0 0 60 60"><path d="M31 5 C45 3 58 15 55 31 C53 46 41 57 27 55 C13 54 3 42 5 28 C7 15 18 6 31 5 Z"/></svg>';
function showChoices(items){
  choices.innerHTML = '';
  const pick = fn => { if(busy) return; busy = true; choices.innerHTML=''; fn(); };
  if(items.length === 1){
    const [label, fn] = items[0];
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = DOODLE + '<span class="lbl"></span>';
    b.querySelector('.lbl').textContent = label;
    b.onclick = () => pick(fn);
    choices.appendChild(b);
    return;
  }
  // 2 lựa chọn: 1 vòng tròn ở giữa; lựa chọn đầu (Okay) bên phải, lựa chọn còn lại bên trái
  const wrap = document.createElement('div');
  wrap.className = 'multi';
  wrap.innerHTML = DOODLE + '<div class="opts"></div>';
  const right = document.createElement('button');
  right.className = 'opt-r'; right.textContent = items[0][0];
  right.onclick = () => pick(items[0][1]);
  wrap.appendChild(right);
  const opts = wrap.querySelector('.opts');
  items.slice(1).forEach(([label, fn]) => {
    const o = document.createElement('button');
    o.className = 'opt'; o.textContent = label;
    o.onclick = () => pick(fn);
    opts.appendChild(o);
  });
  choices.appendChild(wrap);
}
const showChoice = (label, fn) => showChoices([[label, fn]]);
function spiralPath(){
  let d = '';
  for(let a = 0; a <= 6.2*Math.PI; a += .2){
    const r = 3 + a*2.3;
    d += (a ? 'L' : 'M') + (50 + r*Math.cos(a)).toFixed(1) + ' ' + (50 + r*Math.sin(a)).toFixed(1);
  }
  return d;
}
function showRewind(){
  choices.innerHTML = '';
  const b = document.createElement('button');
  b.className = 'rewind'; b.setAttribute('aria-label','Rewind');
  b.innerHTML = '<svg viewBox="0 0 100 100"><path d="'+spiralPath()+'"/></svg>';
  b.onclick = () => { if(busy) return; busy = true; rewind(); };
  choices.appendChild(b);
  // Dùng frame đầu của rewind.gif làm hình nút (nếu không tải được thì giữ xoắn ốc)
  const im = new Image();
  im.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = im.naturalWidth; cv.height = im.naturalHeight;
    cv.getContext('2d').drawImage(im, 0, 0);
    b.innerHTML = ''; b.classList.add('pic'); b.appendChild(cv);
  };
  im.src = 'rewind.gif';
}

/* Tua ngược video nền bằng cách lùi currentTime */
let reversing = false;
function startReverse(){
  reversing = true; bg.pause();
  let last = performance.now();
  (function step(now){
    if(!reversing) return;
    const dt = (now - last) / 1000; last = now;
    let t = bg.currentTime - dt * REVERSE_SPEED;
    if(t <= 0) t = (bg.duration || 1) - 0.05;
    bg.currentTime = t;
    requestAnimationFrame(step);
  })(last);
}
function stopReverse(){ reversing = false; bg.play().catch(()=>{}); }

/* Thanh âm lượng (áp dụng cho song.mp3 và rewind.mp3) */
let userMuted = false;
const volRange = document.getElementById('volrange');
const volWaves = document.getElementById('volwaves');
function applyVolume(){
  const v = parseFloat(volRange.value);
  const rwS = document.getElementById('rwsound');
  song.volume = v; rwS.volume = v;
  song.muted = userMuted; rwS.muted = userMuted;
  volRange.style.setProperty('--p', (userMuted ? 0 : v * 100) + '%');
  const lvl = (userMuted || v === 0) ? 0 : v < .5 ? 1 : 2;
  volWaves.innerHTML = lvl === 0 ? '<path d="M16 9l6 6M22 9l-6 6"/>'
    : lvl === 1 ? '<path d="M15.5 8.5a5 5 0 0 1 0 7"/>'
    : '<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
}
volRange.addEventListener('input', () => { userMuted = false; applyVolume(); });
document.getElementById('volbtn').addEventListener('click', () => {
  if(parseFloat(volRange.value) === 0){ volRange.value = 1; userMuted = false; } else userMuted = !userMuted;
  applyVolume();
});

/* Video luôn tắt tiếng; sau rewind đổi sang rewinded.mp4 và phát song.mp3 */
bg.muted = true; bg.defaultMuted = true;
const song = document.getElementById('song');
function unlockSong(){            // gọi ngay trong lúc click để trình duyệt cho phép phát nhạc sau đó
  song.muted = true;
  song.play().then(() => { song.pause(); song.currentTime = 0; song.muted = userMuted; })
             .catch(() => { song.muted = userMuted; });
}
function switchVideo(){
  reversing = false;
  bg.src = 'rewinded.mp4';
  bg.muted = true; bg.loop = true;
  bg.load();
  bg.play().catch(()=>{});
  song.muted = userMuted;
  song.play().catch(()=>{});
}

applyVolume();

/* ====== FLOW ====== */
async function breakVase(){
  if(busy) return; busy = true;
  await swapVase('brokenvase.png');
  await setText("Ôi không, em làm vỡ nó rồi. Nhưng mà đừng lo, em có thể quay lại thời gian mà.");
  busy = false; showChoice('Okay', step2);
}
async function step2(){
  await setText('Nhắm mắt tập trung và niệm: "Hãy nhớ về hình dáng ngày xưa của ngươi, cho ta thấy nó một lần nữa"');
  busy = false; showRewind();
}
async function rewind(){
  unlockSong();
  const rw = document.getElementById('rwsound');
  rw.currentTime = 0; rw.play().catch(()=>{});
  document.body.classList.add('rewinding');
  startReverse();
  // phát rewind.gif (thêm tham số để GIF chạy lại từ đầu)
  const src = 'rewind.gif?t=' + Date.now();
  choices.innerHTML = '<img id="rwgif" alt="rewind">';
  document.getElementById('rwgif').src = src;
  await wait(REWIND_MS);
  // hết 5s -> tiếp tục flow
  rw.pause(); rw.currentTime = 0;
  switchVideo();
  document.body.classList.remove('rewinding');
  choices.innerHTML = '';
  await swapVase('vase2.png');
  setDeco('pear');
  await setText('Wow, cảm ơn em đã sửa cái bình nha.');
  busy = false; showChoice('No problem', step4);
}
async function loadTxt(file, fallback){
  try{
    const r = await fetch(file + '?t=' + Date.now());
    if(r.ok) return (await r.text()).trim();
  }catch(e){}
  return fallback;
}
async function step4(){
  await setText("Đây là phần thưởng của em, em hãy mở hộp quà đi.");
  busy = false; showChoice('Em mở rồi', step5);
}
async function step5(){
  await setText(await loadTxt('text1.txt', TEXT1));
  busy = false; showChoice('Yes', step6);
}
async function step6(){
  await setText(await loadTxt('text2.txt', TEXT2));
  busy = false;
  showChoices([
    ['Okay', step10],
    ['Tại sao cái bình vẫn ở đây', step9A],
    ['Ghê vậy sao', step10]
  ]);
}
async function step9A(){
  await setText('Kệ nó mà đọc tiếp đi.');
  busy = false;
  showChoices([
    ['Okay', step10],
    ["Hey, I don't want it to be here", step9B]
  ]);
}
async function step9B(){
  await setText('Cái bình này đại diện cho anh mà sao em đuổi? Đọc tiếp đi.');
  busy = false;
  showChoices([['Fine', step10]]);
}
const TEXT3 = "Trước tiên thì cảm ơn em thời gian qua đã luôn ở bên anh dù có nắng, mưa, sương mù. Anh tặng món quà này dựa trên rất nhiều lý do, em có đoán được là gì không.";
const TEXT4 = "Oh well, đây là một trong những thứ em đã muốn từ lâu, nó sẽ giúp em trong những lúc đi chơi cũng như là lúc cosplay";
const TEXT5 = "Okay bây giờ mở quà đi em.";
const TEXT6 = "Đây là tin nhắn failsafe tại tui sợ bà bấm lộn trước khi mở quà, mở rồi mới bấm trang tiếp theo nha.";
const TEXT7 = "Surprise!!! Anh nhớ em luôn bảo mình muốn một cái máy ảnh, em dành thời gian đắn đo suy nghĩ nhiều ấy nên anh đã nghĩ về việc tặng em 1 cái từ lâu rồi.";
const TEXT8 = "Hồi đầu năm anh đi đám cưới bạn anh và anh thấy nhỏ đó có một cái máy chụp như này trông dễ thương vô cùng luôn nên tui có hỏi mẫu mã và mua 1 cái!";
const TEXT10 = "Anh hy vọng là em thích món quà này. Cho dù sau này dù chúng ta có hướng đi riêng hoặc chung thì anh vẫn rất là thương em. Chúc em luôn hạnh phúc, khoẻ mạnh và có nhiều thành công trong cuộc sống\n\nAlways love you.";
const TEXT9 = "Bây giờ em có thể nói mình là Max Caulfield rồi đấy! Hãy chụp mọi khoảnh khắc vui vẻ, hạnh phúc mà em có nha.";

const deco = document.getElementById('deco');
const DECOS = { pear:['pear.gif','pear'], nora:['nora.gif','tilt nora'], a4:['a4.gif','a4'] };
function setDeco(key){
  const [src, cls] = DECOS[key];
  deco.className = 'deco ' + cls;
  if(!deco.src.endsWith(src)) deco.src = src;
  requestAnimationFrame(() => deco.classList.add('on'));
}

async function scene(t, opts){
  await setText(t);
  busy = false;
  if(opts) showChoices(opts);
}
