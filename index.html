<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinh Nhật Nora</title>
<link rel="icon" type="image/png" href="pear1.png">
<link rel="apple-touch-icon" href="pear1.png">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Mali:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;background:#0b0d10}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
main{position:relative;z-index:3;height:100%;display:flex;overflow-x:hidden;overflow-y:auto;padding:16px}
.card{width:min(440px,100%);min-height:220px;margin:auto;padding:30px 24px;
 display:flex;align-items:center;justify-content:center;
 background:#e9dfc4 url('paper.png') center/cover no-repeat;border-radius:4px;color:#2b2118;
 box-shadow:0 2px 4px rgba(0,0,0,.35),0 18px 50px rgba(0,0,0,.65),inset 0 0 60px rgba(90,60,20,.25);
 transform:rotate(-.6deg)}
h1{font:400 clamp(34px,8vw,56px)/1.15 'Patrick Hand','Mali',cursive;text-align:center}
</style>
</head>
<body>
<video id="bg" src="background.mp4" autoplay muted loop playsinline></video>
<main>
  <div class="card"><h1>Chúc mừng sinh nhật</h1></div>
</main>
<script>
const bg = document.getElementById('bg');
bg.muted = true; bg.defaultMuted = true;
</script>
</body>
</html>
